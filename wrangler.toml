name               = "in-return-orders-worker"
main               = "index.js"
compatibility_date = "2025-01-01"
workers_dev        = true


[observability]
enabled = true

# ─────────────────────────────────────────────────────────────
# 🔴 **مفيش [[d1_databases]] — والغياب ده مقصود ومكتوب.**
# الأداة **قراءة بحتة**: صفر كتابة على شوبيفاي وصفر صف في السجل.
# binding موجود بلا مستهلك = كود ميت، وبيدّي انطباع إن فيه تسجيل شغّال.
# ⛔ أول ما يتضاف أي فعل بيكتب: الـ binding يترجع هنا (اسمه `DB` **بالحرف**
#    — أي اسم تاني = كتابة فاشلة بصمت)، ومعاه `log-values.json` بتاع الريبو
#    و`tool` في `ecommoda-constants` §7.1 **في نفس الـ commit** (Rule 7).
# ─────────────────────────────────────────────────────────────

[vars]
SHOP_DOMAIN = "6c7e1a-53.myshopify.com"

# ─────────────────────────────────────────────────────────────
# [vars] والنشر
# ─────────────────────────────────────────────────────────────
# الأداة دي بتتنشر من git عبر Workers Builds، يعني الـ [vars] فوق **بتتطبّق
# فعلاً** مع كل push.
# ⚠️ ممنوع تضيف أو تعدّل SHOP_DOMAIN بإيدك في الداشبورد — أول push بيدهس القيمة
#    اليدوية (واقعة موثّقة: PRICE_DIFFERENCE في stylebox-price-sync-worker ·
#    12-09-2026).
# لو SHOP_DOMAIN ضاعت: كل نداء شوبيفاي بيرجّع «"error code: 1003" is not valid JSON».
# ─────────────────────────────────────────────────────────────
# الأسرار — Dashboard → Settings → Variables → علّم "Secret"
# ممنوع تتكتب في الريبو. اكتب الأسماء، متلزقش القيم.
# ⚠️ بعد إضافة أي سر → Deployments → Version History → ⋯ → **Promote**
#    من غير Promote القيمة بتفضل undefined → كل نداء Unauthorized.
# ⚠️ اكتب أسماء المتغيّرات بالكيبورد — اللصق بيسيب مسافة مخفية في الاسم والقيمة
#    بتتقري undefined.
# ─────────────────────────────────────────────────────────────
# WORKER_SECRET   ← 🔴 **قيمة مجموعة `delivery_cod_ops`** — مش قيمة فريدة للأداة
#                    دي. الهب بيبعت سر واحد لكل Workers المركز من مفتاح
#                    localStorage واحد. قيمة مختلفة هنا = 401 من الأداة دي بس،
#                    والشاشة بتفتح عادي وطابورها لوحده هو اللي بيقع.
#                    ⚠️ مجموعة مستقلة عن `warehouse_ops` — محطة الشحن مالهاش
#                    علاقة بسر محطة المخزن.
#                    ⚠️ والانضمام **لازم يتسجّل** في `ecommoda-constants` →
#                    `references/secret-groups.md` (قاعدة ٢) — عضو غير مسجّل
#                    = التدوير بيتكسر بصمت.
# CLIENT_ID       ← Shopify OAuth (نفس الـ Custom App بتاع باقي الستاك)
# CLIENT_SECRET   ← Shopify OAuth
# ─────────────────────────────────────────────────────────────
